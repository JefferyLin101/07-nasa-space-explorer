<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>

  <!-- NASA's web fonts: Inter (headings), Public Sans (body text), DM Mono (labels and dates) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;600;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet" />

  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <div class="header-text">
        <h1>Space Explorer</h1>
        <p class="tagline">Astronomy Picture of the Day</p>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Date pickers and button -->
    <div class="filters">
      <label class="field">
        <span class="field-label">Start date</span>
        <input type="date" id="startDate" />
      </label>
      <label class="field">
        <span class="field-label">End date</span>
        <input type="date" id="endDate" />
      </label>
      <button type="button" id="getImagesBtn" class="primary-button">Get Space Images</button>
    </div>

    <!-- LevelUp: random "Did You Know?" space fact -->
    <section class="fact-card" aria-label="Random space fact">
      <p class="fact-label">✨ Did you know?</p>
      <p id="factText" class="fact-text"></p>
    </section>

    <!-- Gallery (script.js fills this in) -->
    <div id="gallery" class="gallery" aria-live="polite">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>Images and text from NASA's Astronomy Picture of the Day (APOD).</p>
  </footer>

  <!-- Modal: opens when you click a gallery item -->
  <dialog id="modal" class="modal" aria-labelledby="modalTitle">
    <div class="modal-inner">
      <button type="button" id="modalClose" class="modal-close" aria-label="Close">&times;</button>
      <div id="modalBody"></div>
    </div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
